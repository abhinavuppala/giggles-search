<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google! — 1998 Recreation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://web.archive.org/web/19990504112211im_/http://www.google.com/favicon.ico"
        type="image/x-icon">
</head>

<body>
    <!-- Header Logo -->
    <header>
        <!-- <img src="google.jpg" alt="Google! Logo" class="logo"> -->
         <div class="giggles-logo">
            <span class="blue">G</span><span class="red">i</span><span class="yellow">g</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span><span class="blue">s</span><span class="red">!</span>
        </div>
    </header>

    <!-- Search Box -->
    <main>
        <div class="search-container">
            <div class="search-box">
                <p class="search-label">Search the web using Google!</p>
                <form action="https://www.google.com/search" method="GET">
                    <input type="text" name="q" class="search-input" placeholder="" autofocus>
                    <div class="search-buttons">
                        <input type="submit" value="Google Search" class="btn">
                        <input type="submit" name="btnI" value="I'm Feeling Lucky" class="btn">
                    </div>
                </form>
            </div>
        </div>

        <!-- Info Cards -->
        <section class="info-cards">
            <div class="card card-special">
                <h3>Special Searches</h3>
                <a href="https://web.archive.org/web/19990125092543/http://google.stanford.edu/linux.html">Linux
                    Search</a>
                <a href="https://web.archive.org/web/19990125092543/http://google.stanford.edu/">Stanford Search</a>
            </div>

            <div class="card card-help">
                <a href="https://web.archive.org/web/19990221212930if_/http://www.google.com/help.html">Help!</a>
                <a href="https://web.archive.org/web/19990427105230if_/http://www.google.com/about.html">About
                    Google!</a>
                <a href="https://web.archive.org/web/19990221202430if_/http://www.google.com/company.html">Company
                    Info</a>
                <a href="https://web.archive.org/web/19990224043535if_/http://www.google.com/stickers.html">Get Google!
                    Stickers</a>
            </div>

            <div class="card card-subscribe">
                <h3>Get Google! Updates</h3>
                <p>Monthly newsletter:</p>
                <input type="email" placeholder="your e-mail" class="email-input">
                <button class="btn-subscribe">Subscribe</button>
                <a href="https://web.archive.org/web/19990508023852if_/http://www.google.com/archive.html">Archive</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>Copyright ©1998 Google Inc.</p>
        <p class="meta">Faithfully recreated from the <a
                href="https://web.archive.org/web/19981202230410if_/http://www.google.com/" target="_blank">Wayback
                Machine</a></p>
    </footer>
</body>

</html>

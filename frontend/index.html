<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giggles!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://web.archive.org/web/19990504112211im_/http://www.google.com/favicon.ico"
        type="image/x-icon">
</head>

<body>
    <!-- Header Logo -->
    <header>
        <!-- <img src="google.jpg" alt="Google! Logo" class="logo"> -->
         <div class="giggles-logo">
            <span class="blue">G</span><span class="red">i</span><span class="yellow">g</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span><span class="blue">s</span><span class="red">!</span>
        </div>
    </header>

    <!-- Search Box -->
    <main>
        <div class="search-container">
            <p class="search-label">UI based on https://github.com/Batuhania/Google-1998</p>
            <div class="search-box">
                <p class="search-label">CS 121 Search Engine Project - Abhinav Uppala</p>
                <form id="search-form" action="/api/search" method="GET">
                    <input type="text" name="q" class="search-input" placeholder="" autofocus>
                    <div class="search-buttons">
                        <input type="submit" value="Giggles Search" class="btn">
                        <input type="submit" value="I'm Feeling Lucky" class="btn">
                    </div>
                </form>
            </div>
        </div>

        <!-- AI summary placeholder -->
        <section id="summary-section" class="summary-section" hidden>
            <h2>AI Summary</h2>
            <div id="summary-content" class="summary-content" aria-live="polite"></div>
        </section>

        <!-- Search results -->
        <section id="results-section" class="results-section" hidden>
            <p id="search-stats" class="search-stats" aria-live="polite"></p>
            <div id="search-results"></div>
        </section>
    </main>

    <script src="script.js"></script>
    
    <!-- Footer -->
    <footer>
        <p>Copyright ©1998 Google Inc.</p>
        <p class="meta">Faithfully recreated from the <a
                href="https://web.archive.org/web/19981202230410if_/http://www.google.com/" target="_blank">Wayback
                Machine</a></p>
    </footer>
</body>

</html>
